@keyframes scr{0%,8%{fill:#fff3ee}28%{fill:#3a1b2c}48%,80%{fill:#140a12}90%,100%{fill:#fff3ee}}
.rowbg{animation:rowbg 12s linear infinite}
@keyframes rowbg{0%,8%{fill:#2a142010}28%{fill:#fff0f512}48%,80%{fill:#ffffff0c}90%,100%{fill:#2a142010}}
.pill{animation:pill 12s linear infinite}
@keyframes pill{0%,8%{fill:#2a14200d}28%{fill:#fff0f51a}48%,80%{fill:#ffffff12}90%,100%{fill:#2a14200d}}
