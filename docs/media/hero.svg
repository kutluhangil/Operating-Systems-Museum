@keyframes toast{0%,8%{fill:#ffffff}28%{fill:#4a2238}48%,80%{fill:#26121e}90%,100%{fill:#ffffff}}
.edge{animation:edge 12s linear infinite}
@keyframes edge{0%,8%{stroke:#2a142024}28%{stroke:#fff0f526}48%,80%{stroke:#ffffff1f}90%,100%{stroke:#2a142024}}
.shade{animation:shade 12s linear infinite}
@keyframes shade{0%,8%{fill-opacity:.10}28%{fill-opacity:.22}48%,80%{fill-opacity:.45}90%,100%{fill-opacity:.10}}
.lit{filter:drop-shadow(0 0 3px currentColor)}
.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.ping{animation:ping 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes er0{0%{opacity:0}0%{opacity:0}2.5%{opacity:1}33.3%{opacity:1}35.8%{opacity:0}100%{opacity:0}}
@keyframes er1{0%{opacity:0}33.3%{opacity:0}35.8%{opacity:1}66.7%{opacity:1}69.2%{opacity:0}100%{opacity:0}}
@keyframes er2{0%{opacity:0}66.7%{opacity:0}69.2%{opacity:1}98.3%{opacity:1}100.8%{opacity:0}100%{opacity:0}}
.boot{animation:boot 4s ease-out infinite;transform-box:fill-box;transform-origin:left}@keyframes boot{0%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}
.head{animation:head 12s cubic-bezier(.45,.05,.3,1) infinite}
@keyframes head{0%{transform:translateX(143px)}30%{transform:translateX(143px)}36.7%{transform:translateX(154px)}63.3%{transform:translateX(154px)}70%{transform:translateX(253px)}96.7%{transform:translateX(253px)}100%{transform:translateX(143px)}}
.otd{animation:otd 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes otd{0%{opacity:0;transform:translateY(-14px)}41.7%{opacity:0;transform:translateY(-14px)}44.6%{opacity:1;transform:none}63.3%{opacity:1;transform:none}66.3%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
