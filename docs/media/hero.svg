<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="OS Museum — an interactive archive of operating-systems history">
<style>
.bg{animation:bg 12s linear infinite}
@keyframes bg{0%,8%{fill:#f6efe3}28%{fill:#6b4a3a}48%,80%{fill:#17120f}90%,100%{fill:#f6efe3}}
.ink{animation:ink 12s linear infinite}
@keyframes ink{0%,8%{fill:#2a1f18}28%{fill:#fff4e8}48%,80%{fill:#f8ece0}90%,100%{fill:#2a1f18}}
.rule{animation:rule 12s linear infinite}
@keyframes rule{0%,8%{stroke:#2a1f1833}28%{stroke:#fff4e833}48%,80%{stroke:#f8ece033}90%,100%{stroke:#2a1f1833}}
.panel{animation:panel 12s linear infinite}
@keyframes panel{0%,8%{fill:#2a1f1812}28%{fill:#fff4e812}48%,80%{fill:#f8ece012}90%,100%{fill:#2a1f1812}}
.muted{opacity:.72}
.stars{animation:stars 12s linear infinite}
@keyframes stars{0%,8%{opacity:0}28%{opacity:.25}48%,80%{opacity:.9}90%,100%{opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.lit{filter:drop-shadow(0 0 4px currentColor)}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(-1)}}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(3.2);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes grow{0%{transform:scaleY(.08)}35%,80%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
@keyframes draw{0%{stroke-dashoffset:700}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-700}}
@keyframes blink{50%{opacity:0}}
@keyframes feed{0%{transform:translateY(150px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes slide{to{transform:translateX(100px)}}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes drop{0%,6%{transform:scaleY(0);opacity:0}16%,88%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(0);opacity:0}}
@keyframes gauge{0%,10%{stroke-dashoffset:390}40%,85%{stroke-dashoffset:110}100%{stroke-dashoffset:390}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:skewX(-18deg) translateX(0)}60%,100%{transform:skewX(-18deg) translateX(788px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" width="1200" height="440" rx="28" fill="#f6efe3"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="2.4"><text class="ink muted" x="64" y="104">INTERACTIVE ARCHIVE · REACT + R3F</text></g>
<text class="ink" x="60" y="236" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="78" letter-spacing="-1">OS Museum.</text>
<text class="ink muted" x="64" y="300" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="20">From the first command line to the modern desktop.</text>
<line class="rule" x1="64" y1="372" x2="1136" y2="372"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1.8">
  <text class="ink muted" x="64" y="404">23 SYSTEMS · FIVE DECADES</text>
  <text class="ink muted" x="600" y="404" text-anchor="middle">LIVE BOOT SIMULATOR</text>
  <text class="ink muted" x="1136" y="404" text-anchor="end">DAYLIGHT · AFTER-HOURS · CRT</text>
</g>
